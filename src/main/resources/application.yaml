spring:
  application:
    name: daouoffice-agent
  datasource:
    url: ${AGENT_DB_URL:jdbc:mariadb://127.0.0.1:3306/daou_agent?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${AGENT_DB_USERNAME:root}
    password: ${AGENT_DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: always
  ai:
    model:
      chat: ollama
    openai:
      api-key: ${OPENAI_API_KEY:test-key}

agent:
  storage:
    type: jdbc
  llm-provider: ollama
  max-loop: 5
  recent-message-count: 12
  ollama:
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
    max-retries: 2
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  tools:
    default-timeout-ms: 5000
    default-max-attempts: 2
  daou-portal:
    base-url: https://portal.daou.co.kr/openapi2
    auth-url: https://portal.daou.co.kr/oauth/token
    client-id: ae73df48d75f1eea0e7c6cc940d8724b
    client-secret: ${DAOU_PORTAL_CLIENT_SECRET:__REDACTED__}
    username: ${DAOU_PORTAL_USERNAME:__REDACTED__}
    password: ${DAOU_PORTAL_PASSWORD:__REDACTED__}
    default-calendar-id: 7627
    default-attendee-id: 5397
    token-refresh-skew-seconds: 60
